name: esmeraldas_resiliente_movil
description: "Aplicación Móvil Institucional para Gestión de Riesgos, Censo y Emergencias de Esmeraldas"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Networking & REST API
  dio: ^5.4.1
  http_parser: ^4.0.2

  # PostGIS & Geospatial
  geolocator: ^11.0.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Offline Storage & Persistence
  sqflite: ^2.3.2
  path: ^1.9.0
  shared_preferences: ^2.2.2

  # Media & Hardware
  image_picker: ^1.0.7

  # Utilities & Design
  uuid: ^4.3.3
  intl: ^0.19.0
  connectivity_plus: ^5.0.2
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
